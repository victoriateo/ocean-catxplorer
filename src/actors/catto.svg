      <path d="M60 88 L 71 86"/><path d="M62 98 L 72 95"/>
      <path d="M149 86 L 160 88"/><path d="M148 96 L 158 99"/>
    </g>
    <ellipse cx="84" cy="101" rx="7" ry="4" fill="#f39a8a" opacity=".55"/>
    <ellipse cx="144" cy="101" rx="7" ry="4" fill="#f39a8a" opacity=".55"/>
    <g class="eyes" id="eyesN">
      <ellipse cx="97" cy="83" rx="11" ry="13.5" fill="#1d3550"/>
      <ellipse cx="131" cy="83" rx="11" ry="13.5" fill="#1d3550"/>
      <circle cx="101" cy="77" r="4" fill="#fff"/>
      <circle cx="135" cy="77" r="4" fill="#fff"/>
      <circle cx="94" cy="89" r="1.7" fill="#fff"/>
      <circle cx="128" cy="89" r="1.7" fill="#fff"/>
    </g>
    <path d="M114 97 c -3 -4 -8 -1 -5 3 l 5 5 l 5 -5 c 3 -4 -2 -7 -5 -3z" fill="#e8738a"/>
    <path id="mouthN" d="M107 107 q 3.5 4 7 0 q 3.5 4 7 0" stroke="#7a3b2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <g id="joyFace">
      <path d="M88 86 q 9 -11 18 0" stroke="#1d3550" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M122 86 q 9 -11 18 0" stroke="#1d3550" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M106 104 q 8 12 16 0 z" fill="#7a3b2a"/><path d="M110 108 q 4 4 8 0" fill="#f08a9a"/>
      <ellipse cx="84" cy="100" rx="8" ry="4.5" fill="#f37f8c" opacity=".7"/><ellipse cx="144" cy="100" rx="8" ry="4.5" fill="#f37f8c" opacity=".7"/>
    </g>
    <g id="shockFace">
      <circle cx="97" cy="83" r="14" fill="#fff"/><circle cx="131" cy="83" r="14" fill="#fff"/>
      <circle cx="97" cy="83" r="14" fill="none" stroke="#1d3550" stroke-width="2.5"/><circle cx="131" cy="83" r="14" fill="none" stroke="#1d3550" stroke-width="2.5"/>
      <circle cx="98" cy="84" r="6.5" fill="#1d3550"/><circle cx="130" cy="84" r="6.5" fill="#1d3550"/>
      <circle cx="100" cy="81" r="2" fill="#fff"/><circle cx="132" cy="81" r="2" fill="#fff"/>
      <ellipse cx="114" cy="111" rx="4.5" ry="6" fill="#7a3b2a"/><ellipse cx="114" cy="114" rx="3" ry="2.5" fill="#f08a9a"/>
      <path d="M80 92 l 6 3 M78 98 l 6 1" stroke="#e8738a" stroke-width="2" stroke-linecap="round"/>
      <path d="M154 46 q 6 9 0 13 q -6 -4 0 -13z" fill="#9fdcff" stroke="#5aa9d6" stroke-width="1.2"/>
    </g>
  </g>
  <!-- front arm -->
  <path d="M138 136 Q 158 150 154 172" stroke="#2c3e5a" stroke-width="14" stroke-linecap="round" fill="none"/>
  <circle cx="154" cy="175" r="8" fill="#f6b860"/>
  <!-- helmet (animated) -->
  <g id="helmet">
    <g id="lamp" opacity="0"><rect x="99" y="4" width="22" height="11" rx="4" fill="#6f7983"/><circle cx="110" cy="9" r="4.5" fill="#fff6c8"/></g>
    <g id="glass">
      <circle cx="110" cy="80" r="67" fill="url(#glassFill)" stroke="rgba(235,252,255,.85)" stroke-width="3"/>
      <path d="M60 58 A 54 54 0 0 1 98 25" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85"/>
      <circle cx="58" cy="76" r="3.2" fill="#fff" opacity=".85"/>
      <path d="M156 104 A 52 52 0 0 1 140 124" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity=".5"/>
    </g>
    <path d="M80 136 Q 110 147 140 136" stroke="rgba(235,252,255,.75)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M86 140 Q 110 149 134 140" stroke="rgba(255,255,255,.35)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
