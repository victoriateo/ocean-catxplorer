<svg viewBox="0 0 200 220" aria-label="Catto the scuba cat">
  <defs>
    <radialGradient id="glassFill" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e8fdff" stop-opacity=".12"/>
      <stop offset=".75" stop-color="#bff1f7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8fdcea" stop-opacity=".45"/>
    </radialGradient>
  </defs>
  <!-- air tank -->
  <rect x="54" y="112" width="26" height="66" rx="12" fill="#a9b3bd"/>
  <rect x="59" y="116" width="6" height="56" rx="3" fill="#e4e9ee" opacity=".85"/>
  <rect x="54" y="150" width="26" height="4" fill="#8a949e"/>
  <rect x="61" y="104" width="12" height="10" rx="3" fill="#6f7983"/>
  <!-- tail -->
  <g class="tail">
    <path d="M84 186 C 44 196, 16 172, 24 140 C 28 124, 46 126, 42 142 C 38 160, 54 172, 86 172 Z" fill="#f2a54a"/>
    <path d="M36 150 l 9 -3 M33 165 l 9 -6 M48 178 l 6 -8" stroke="#d9822b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- back arm -->
  <path d="M84 138 Q 66 152 70 172" stroke="#22324b" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- legs + flippers -->
  <g class="leg l1">
    <rect x="84" y="190" width="20" height="18" rx="7" fill="#2c3e5a"/>
    <ellipse cx="92" cy="210" rx="17" ry="6" fill="#2fa6a0"/>
  </g>
  <g class="leg l2">
    <rect x="116" y="190" width="20" height="18" rx="7" fill="#2c3e5a"/>
    <ellipse cx="128" cy="210" rx="17" ry="6" fill="#36b8b0"/>
  </g>
  <!-- wetsuit body -->
  <path d="M80 126 C 70 150, 70 184, 82 200 L 140 200 C 152 184, 152 150, 142 126 Z" fill="#2c3e5a"/>
  <path d="M84 128 Q 111 138 138 128 L 140 134 Q 111 145 82 134 Z" fill="#22324b"/>
  <path d="M111 138 L 111 196" stroke="#4a6386" stroke-width="2.5" stroke-dasharray="3 4"/>
  <circle cx="127" cy="152" r="7" fill="#f2a54a"/>
  <circle cx="127" cy="152" r="3" fill="#fff3df"/>
  <!-- head -->
  <g class="head">
    <path d="M64 66 L 70 18 L 104 44 Z" fill="#f2a54a"/>
    <path d="M72 58 L 76 30 L 96 46 Z" fill="#f7b9b0"/>
    <path d="M116 42 L 150 14 L 158 64 Z" fill="#f2a54a"/>
    <path d="M123 44 L 146 25 L 151 57 Z" fill="#f7b9b0"/>
    <ellipse cx="110" cy="82" rx="51" ry="45" fill="#f6b45a"/>
    <g stroke="#d9822b" stroke-width="4" stroke-linecap="round" fill="none">
